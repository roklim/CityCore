<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        font-family: Arial;
        background: #111;
        color: #fff;
        text-align: center;
      }

      input,
      button {
        padding: 10px;
        margin: 5px;
        border-radius: 6px;
        border: none;
      }

      button {
        background: #e63946;
        color: white;
        cursor: pointer;
      }

      .card {
        background: #222;
        margin: 10px;
        padding: 10px;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <h1>🍕 Pizzeria</h1>

    <input id="user" placeholder="user" />
    <input id="pass" placeholder="pass" />
    <button onclick="login()">Login</button>

    <div id="app" style="display: none">
      <input id="customer" placeholder="Nome cliente" />
      <button onclick="addOrder()">+ Margherita</button>

      <div id="orders"></div>
    </div>

    <script>
      const API = "https://mucho-gusto-mg5y.onrender.com"; // ❗ NO slash finale

      let interval = null;

      // LOGIN
      async function login() {
        try {
          const res = await fetch(API + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("user").value,
              password: document.getElementById("pass").value,
            }),
          });

          if (!res.ok) {
            alert("Login fallito");
            return;
          }

          document.getElementById("app").style.display = "block";

          load();

          // evita duplicazioni interval
          if (!interval) {
            interval = setInterval(load, 3000);
          }
        } catch (err) {
          alert("Errore server");
          console.error(err);
        }
      }

      // LOAD ORDERS
      async function load() {
        try {
          const res = await fetch(API + "/orders");
          const data = await res.json();

          document.getElementById("orders").innerHTML = data
            .map(
              (o) => `
      <div class="card">
        <b>${o.customer}</b> (${o.phone || ""})<br>
        ${o.items.map((i) => i.name).join(", ")}<br>
        <b>${o.status}</b><br>

        <button onclick="upd(${o.id},'ready')">Ready</button>
        <button onclick="upd(${o.id},'done')">Done</button>
      </div>
    `,
            )
            .join("");
        } catch (err) {
          console.error("Load error", err);
        }
      }

      // ADD ORDER
      async function addOrder() {
        try {
          await fetch(API + "/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              customer: document.getElementById("customer").value,
              items: [{ name: "Margherita", qty: 1 }],
            }),
          });

          load();
        } catch (err) {
          console.error(err);
        }
      }

      // UPDATE STATUS
      async function upd(id, status) {
        await fetch(API + "/orders/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });

        load();
      }
    </script>
  </body>
</html>
