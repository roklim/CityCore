<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ordina - Mucho Gusto Pizzeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/customer.css" />
    <meta name="api-base-url" content="" />
  </head>

  <body>
    <header class="hero">
      <div class="hero-eyebrow">Pizzeria artigianale</div>
      <h1>Ordina in pochi tocchi, ritira con calma.</h1>
      <p>Pizze, bibite e dolci con un flusso chiaro anche da telefono.</p>
      <a class="hero-admin-link" href="./admin.html">Area Admin</a>
    </header>

    <div class="layout">
      <div class="menu-col" id="menu-col">
        <p>Caricamento menu...</p>
      </div>

      <div class="sidebar">
        <h2>Il tuo ordine</h2>

        <div class="field">
          <label for="f-name">Nome *</label>
          <input id="f-name" type="text" placeholder="Il tuo nome" />
        </div>

        <div class="field">
          <label for="f-phone">Telefono</label>
          <input id="f-phone" type="tel" placeholder="Opzionale" />
        </div>

        <div class="field">
          <label for="f-notes">Note</label>
          <textarea
            id="f-notes"
            rows="3"
            placeholder="Es. senza aglio, extra piccante..."
          ></textarea>
        </div>

        <div class="cart-list" id="cart-list">
          <p class="cart-empty">Nessun prodotto selezionato</p>
        </div>

        <div class="total-row">
          <span>Totale</span>
          <span id="total-val">EUR 0,00</span>
        </div>

        <button class="submit" onclick="submitOrder()">Invia ordine</button>
      </div>
    </div>

    <div id="toast"></div>

    <div id="overlay">
      <div class="confirm-box">
        <div class="confirm-icon">Pizza</div>
        <h2>Ordine ricevuto!</h2>
        <p id="oid-label">Il tuo ordine e in preparazione.</p>
        <button class="btn btn-primary" onclick="resetAll()">
          Nuovo ordine
        </button>
      </div>
    </div>

    <script src="./js/runtime-config.js"></script>
    <script type="module">
      import { getMenu, createOrder } from "./js/api.js";

      let menu = [];
      let cart = [];

      const money = (v) => `EUR ${v.toFixed(2).replace(".", ",")}`;

      function toast(msg) {
        const el = document.getElementById("toast");
        el.innerText = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2500);
      }

      async function boot() {
        try {
          menu = await getMenu();
          renderMenu();
        } catch {
          document.getElementById("menu-col").innerHTML =
            "<p>Errore nel caricamento del menu. Riprova.</p>";
        }
      }

      function renderMenu() {
        document.getElementById("menu-col").innerHTML = `
          <div class="menu-grid">
            ${menu
              .map(
                (m) => `
              <div class="menu-card" onclick="add('${m._id}')">
                <div class="menu-card-emoji">${m.emoji || "Pizza"}</div>
                <div class="menu-card-name">${m.name}</div>
                <div class="menu-card-desc">${m.description || ""}</div>
                <div class="menu-card-price">${money(m.price)}</div>
                <button class="menu-card-btn">+ Aggiungi</button>
              </div>
            `,
              )
              .join("")}
          </div>
        `;
      }

      window.add = function (id) {
        const item = menu.find((m) => m._id === id);
        if (!item) return;
        const existing = cart.find((c) => c.id === id);

        if (existing) existing.qty++;
        else {
          cart.push({
            id,
            name: item.name,
            price: item.price,
            qty: 1,
          });
        }

        renderCart();
        toast(`${item.name} aggiunto`);
      };

      window.remove = function (id) {
        const existing = cart.find((c) => c.id === id);
        if (!existing) return;

        if (existing.qty === 1) cart = cart.filter((c) => c.id !== id);
        else existing.qty--;

        renderCart();
      };

      function renderCart() {
        const list = document.getElementById("cart-list");
        const totalEl = document.getElementById("total-val");

        if (cart.length === 0) {
          list.innerHTML = `<p class="cart-empty">Nessun prodotto selezionato</p>`;
          totalEl.innerText = "EUR 0,00";
          return;
        }

        let total = 0;
        list.innerHTML = cart
          .map((c) => {
            total += c.price * c.qty;
            return `
              <div class="cart-item">
                <span class="cart-item-left">${c.name} x${c.qty}</span>
                <div class="cart-item-right">
                  <span class="cart-item-price">${money(c.price * c.qty)}</span>
                  <button class="cart-item-remove" onclick="remove('${c.id}')" title="Rimuovi">-</button>
                </div>
              </div>
            `;
          })
          .join("");

        totalEl.innerText = money(total);
      }

      window.submitOrder = async function () {
        const name = document.getElementById("f-name").value.trim();
        if (!name) {
          toast("Inserisci il tuo nome");
          return;
        }
        if (cart.length === 0) {
          toast("Aggiungi almeno un prodotto");
          return;
        }

        try {
          const data = await createOrder({
            customer: name,
            phone: document.getElementById("f-phone").value.trim(),
            notes: document.getElementById("f-notes").value.trim(),
            items: cart.map((c) => ({
              id: c.id,
              name: c.name,
              qty: c.qty,
              price: c.price,
            })),
          });

          const label = data._id
            ? `ID ordine: ${data._id}`
            : "Il tuo ordine e in preparazione.";
          document.getElementById("oid-label").innerText = label;
          document.getElementById("overlay").classList.add("show");
        } catch {
          toast("Errore nell'invio. Riprova.");
        }
      };

      window.resetAll = function () {
        cart = [];
        document.getElementById("f-name").value = "";
        document.getElementById("f-phone").value = "";
        document.getElementById("f-notes").value = "";
        renderCart();
        document.getElementById("overlay").classList.remove("show");
      };

      boot();
    </script>
  </body>
</html>
