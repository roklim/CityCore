<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Mucho Gusto Pizzeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <meta name="api-base-url" content="" />
  </head>

  <body>
    <div id="login" class="page-center">
      <div class="card login-card">
        <a class="login-back" href="./customer.html">Torna al menu</a>
        <h3>Admin Login</h3>
        <input
          id="u"
          type="text"
          placeholder="Username"
          onkeydown="if (event.key === 'Enter') login();"
        />
        <input
          id="p"
          type="password"
          placeholder="Password"
          onkeydown="if (event.key === 'Enter') login();"
        />
        <button class="btn btn-primary" onclick="login()">Accedi</button>
      </div>
    </div>

    <div id="app" class="page" style="display: none">
      <div class="card header">
        <div>
          <span class="header-title">Pizzeria Admin</span>
          <a class="header-back" href="./customer.html">Menu cliente</a>
        </div>
        <button class="btn" onclick="logout()">Logout</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Ordini totali</div>
          <div class="stat-value purple" id="tot">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">In preparazione</div>
          <div class="stat-value orange" id="prep">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Pronti</div>
          <div class="stat-value green" id="ready">0</div>
        </div>
      </div>

      <div id="board" class="order-board"></div>
    </div>

    <div id="toast"></div>

    <script src="./js/runtime-config.js"></script>
    <script type="module">
      import {
        loginAdmin,
        getOrders,
        updateOrderStatus,
      } from "./js/api.js";

      let token = localStorage.getItem("admin_token") || "";
      let orders = [];
      let interval = null;

      const loginEl = document.getElementById("login");
      const appEl = document.getElementById("app");

      function toast(msg) {
        const el = document.getElementById("toast");
        el.innerText = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2000);
      }

      window.login = async function () {
        try {
          const data = await loginAdmin(
            document.getElementById("u").value,
            document.getElementById("p").value,
          );
          token = data.token;
          localStorage.setItem("admin_token", token);
          start();
        } catch (err) {
          alert(err.message || "Credenziali non valide");
        }
      };

      function start() {
        loginEl.style.display = "none";
        appEl.style.display = "block";
        load();
        interval = setInterval(load, 4000);
      }

      async function load() {
        try {
          orders = await getOrders(token);
          render();
          stats();
        } catch (err) {
          if (err.message === "401") logout();
        }
      }

      function stats() {
        document.getElementById("tot").innerText = orders.length;
        document.getElementById("prep").innerText = orders.filter(
          (o) => o.status === "preparing",
        ).length;
        document.getElementById("ready").innerText = orders.filter(
          (o) => o.status === "ready",
        ).length;
      }

      function render() {
        const board = document.getElementById("board");

        if (orders.length === 0) {
          board.innerHTML = `<div class="board-empty">Nessun ordine attivo</div>`;
          return;
        }

        const statusLabel = {
          preparing: "Preparazione",
          ready: "Pronto",
          done: "Completato",
        };

        board.innerHTML = orders
          .map(
            (o) => `
              <div class="card order-card">
                <div class="order-header">
                  <span class="order-name">${o.customer}</span>
                  <span class="badge ${o.status}">${statusLabel[o.status] || o.status}</span>
                </div>

                <div class="order-items">
                  ${o.items.map((i) => `${i.qty}x ${i.name}`).join(" | ")}
                </div>

                <div class="order-actions">
                  <button class="btn" onclick="upd('${o._id}','preparing')">Prep</button>
                  <button class="btn btn-primary" onclick="upd('${o._id}','ready')">Pronto</button>
                  <button class="btn" onclick="upd('${o._id}','done')">Done</button>
                </div>
              </div>
            `,
          )
          .join("");
      }

      window.upd = async function (id, status) {
        try {
          await updateOrderStatus(id, status, token);
          await load();
          toast("Stato aggiornato");
        } catch {
          toast("Errore nell'aggiornamento");
        }
      };

      window.logout = function () {
        if (interval) clearInterval(interval);
        localStorage.removeItem("admin_token");
        token = "";
        orders = [];
        appEl.style.display = "none";
        loginEl.style.display = "grid";
      };

      if (token) start();
    </script>
  </body>
</html>
