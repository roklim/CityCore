name: Platform Quality

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: citycore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d citycore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citycore?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-citycore-auth-secret-change-before-prod
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4100

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply Prisma migrations
        run: npm run db:migrate:deploy

      - name: Check Prisma migration status
        run: npm run db:migrate:status

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Seed global demo registry
        run: npm run db:seed:global-demo

      - name: Verify global demo seed is idempotent
        run: npm run db:seed:global-demo

      - name: Verify global demo registry
        run: npm run db:verify:global-demo
        env:
          EXPECT_NO_GEONAMES_IMPORT: "true"

      - name: API unit tests
        run: npm test

      - name: Web unit tests
        run: npm --workspace @platform/web run test

      - name: Lint
        run: npm run lint

      - name: Apply exact Prettier formatting
        run: npx prettier --write apps/web/src/components/public-business/business-info-drawer.tsx apps/web/src/components/public-business/public-pickup-order-form.tsx

      - name: Commit exact formatting
        run: |
          if ! git diff --quiet -- apps/web/src/components/public-business/business-info-drawer.tsx apps/web/src/components/public-business/public-pickup-order-form.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/components/public-business/business-info-drawer.tsx apps/web/src/components/public-business/public-pickup-order-form.tsx
            git commit -m "style: apply exact prettier formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Build api
        run: npm run build:api
