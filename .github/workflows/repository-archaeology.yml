name: Repository Archaeology

on:
  push:
    branches:
      - audit/repository-archaeology

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run archaeology analyzer
        run: node tools/repository-archaeology.mjs
      - name: Knip signal only
        run: npx --yes knip > audit-artifacts/knip.txt 2>&1 || true
      - name: Baseline quality
        run: |
          npm run typecheck
          npm run lint
          npx prettier --check "apps/**/*.{ts,tsx,css,json,md}" "packages/**/*.{ts,tsx,json,md}" "package.json" "tsconfig.json" "tsconfig.base.json" "compose.yml" "render.yaml" "render.staging.yaml" ".github/workflows/platform-quality.yml" ".github/workflows/staging-deploy.yml" ".vscode/*.json" "docs/**/*.md"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-archaeology
          path: audit-artifacts
