name: Repository Archaeology

on:
  push:
    branches:
      - audit/repository-archaeology

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run archaeology analyzer
        run: node tools/repository-archaeology.mjs
      - name: Baseline quality
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: repository-archaeology
          path: audit-artifacts
