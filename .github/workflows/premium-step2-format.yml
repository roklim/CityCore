name: Premium UI Step 2 Format

on:
  push:
    branches:
      - feature/premium-ui-step2-public-showcase

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-ui-step2-public-showcase
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format STEP 2 files
        run: >-
          npx prettier --write
          apps/web/src/app/layout.tsx
          apps/web/src/app/public-showcase.css
          apps/web/src/components/public-shell.tsx
          apps/web/src/components/public-home/global-entry-home.tsx
          apps/web/src/components/public-home/city-utility-home.tsx
          apps/web/src/components/public-home/city-business-directory.tsx
          'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx'
      - name: Commit formatting when needed
        run: |
          git add apps/web/src/app/layout.tsx apps/web/src/app/public-showcase.css apps/web/src/components/public-shell.tsx apps/web/src/components/public-home/global-entry-home.tsx apps/web/src/components/public-home/city-utility-home.tsx apps/web/src/components/public-home/city-business-directory.tsx 'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx'
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format premium public showcase"
          git push origin HEAD:feature/premium-ui-step2-public-showcase
