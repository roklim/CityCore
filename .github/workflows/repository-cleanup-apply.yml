name: Apply Repository Cleanup

on:
  push:
    branches:
      - audit/repository-archaeology

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: citycore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d citycore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citycore?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/citycore?schema=integration_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: cleanup-citycore-auth-secret-not-for-production
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4100
      PORT: 4100
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/repository-archaeology
          fetch-depth: 0
      - name: Checkout audit tooling
        uses: actions/checkout@v4
        with:
          ref: audit/repository-archaeology
          path: audit-tools
          sparse-checkout: |
            tools/apply-repository-cleanup-pass3.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply manifest integrity pass
        run: node audit-tools/tools/apply-repository-cleanup-pass3.mjs
      - name: Refresh lockfile
        run: npm install --package-lock-only
      - name: Install cleaned dependency graph
        run: npm ci
      - name: Format manifest changes
        run: |
          npx prettier --write package.json apps/web/package.json package-lock.json
      - name: Dependency tree
        run: npm ls
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Full audit report
        run: npm audit --json > /tmp/npm-audit.json || true
      - name: Generate and validate Prisma
        run: |
          npm run db:generate
          npm run db:validate
      - name: Migrate clean databases
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:status
          npm run db:test:reset
          node tools/run-prisma-test.mjs migrate status
      - name: Unit and integration tests
        run: |
          npm --workspace @platform/web run test
          npm --workspace @platform/api run test
          npm run test:integration
      - name: Typecheck lint format
        run: |
          npm --workspace @platform/web run typecheck
          npm --workspace @platform/api run typecheck
          npm run typecheck
          npm run lint
          npm run format:check
          git diff --check
      - name: Builds
        run: |
          npm run build:web
          npm run build:api
          npm run build
      - name: Runtime smoke
        run: |
          NODE_ENV=production PORT=4100 node apps/api/dist/index.js > /tmp/citycore-api.log 2>&1 &
          echo $! > /tmp/citycore-api.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4100/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          test "$(curl --silent --output /tmp/public.json --write-out '%{http_code}' 'http://127.0.0.1:4100/api/v2/public/cities?limit=1')" = "200"
          protected=$(curl --silent --output /tmp/protected.json --write-out '%{http_code}' 'http://127.0.0.1:4100/api/v2/platform-core/cities?limit=1')
          test "$protected" = "401" -o "$protected" = "403"
      - name: Post-cleanup dead-code signal
        run: npx --yes knip > /tmp/knip-after.txt 2>&1 || true
      - name: Require no accidental generated changes
        run: |
          git checkout -- apps/web/next-env.d.ts || true
          rm -rf audit-tools
          git diff --check
          git status --short
      - name: Commit manifest integrity pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: make workspace tool dependencies explicit"
          git push origin HEAD:cleanup/repository-archaeology
          git rev-parse HEAD
          echo '--- KNIP AFTER ---'
          cat /tmp/knip-after.txt
          echo '--- NPM AUDIT ---'
          cat /tmp/npm-audit.json
          echo '--- DIFF VS FEATURE BASE ---'
          git diff --stat 3e8b4486170948a5ee6a5a9be9883ac7af7ae74e..HEAD
      - name: API logs on failure
        if: failure()
        run: cat /tmp/citycore-api.log 2>/dev/null || true
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/citycore-api.pid ]; then kill "$(cat /tmp/citycore-api.pid)" 2>/dev/null || true; fi
