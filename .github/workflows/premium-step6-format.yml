name: Premium UI Step 6 Format

on:
  push:
    branches:
      - feature/premium-ui-step6-business-editors

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-ui-step6-business-editors
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format STEP 6 files
        run: npx prettier --write apps/web/src/app/business-editor-premium.css apps/web/src/app/layout.tsx
      - name: Commit formatting when needed
        run: |
          git add apps/web/src/app/business-editor-premium.css apps/web/src/app/layout.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format premium business editors"
          git push origin HEAD:feature/premium-ui-step6-business-editors
