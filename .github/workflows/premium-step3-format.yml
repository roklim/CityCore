name: Premium UI Step 3 Format

on:
  push:
    branches:
      - feature/premium-ui-step3-admin-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-ui-step3-admin-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format STEP 3 files
        run: >-
          npx prettier --write
          apps/web/src/app/admin/login/page.tsx
          apps/web/src/components/operator-loading-state.tsx
      - name: Commit formatting when needed
        run: |
          git add apps/web/src/app/admin/login/page.tsx apps/web/src/components/operator-loading-state.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format premium operator workspace"
          git push origin HEAD:feature/premium-ui-step3-admin-shell
