name: Apply Polish Fixes

on:
  push:
    branches:
      - agent/global-city-registry-step1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-city-registry-step1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply focused polish changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          pickup = 'apps/web/src/components/public-business/public-pickup-order-form.tsx'
          replace(
              pickup,
              '} from "../../lib/platform-api";\n\ntype FormValues = {\n  name: string;\n  email: string;\n  phone: string;\n  notes: string;\n  privacyAccepted: boolean;\n  company: string;\n};\n\ntype FieldErrors = Partial<Record<keyof FormValues | "items" | "pickup", string>>;\n\nconst initialValues: FormValues = {',
              '} from "../../lib/platform-api";\nimport {\n  validatePublicPickupValues,\n  type PublicPickupFieldErrors,\n  type PublicPickupFormValues,\n} from "../../lib/public-form-validation";\n\nconst initialValues: PublicPickupFormValues = {'
          )
          start = '''function validate(values: FormValues, itemCount: number, pickupTime: string): FieldErrors {\n  const errors: FieldErrors = {};\n  if (itemCount < 1) errors.items = "Aggiungi almeno una voce del menu all'ordine.";\n  if (!pickupTime) errors.pickup = "Scegli un orario di ritiro disponibile.";\n  if (values.name.trim().length < 2 || values.name.trim().length > 120)\n    errors.name = "Inserisci un nome valido.";\n  if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/u.test(values.email))\n    errors.email = "Inserisci un indirizzo email valido.";\n  if (values.phone && (values.phone.trim().length > 60 || /<[^>]*>/u.test(values.phone)))\n    errors.phone = "Inserisci un telefono valido.";\n  if (values.notes.trim().length > 1_000)\n    errors.notes = "Le note possono contenere al massimo 1000 caratteri.";\n  if (!values.privacyAccepted) errors.privacyAccepted = "Il consenso privacy è obbligatorio.";\n  return errors;\n}\n\n'''
          replace(pickup, start, '')
          replace(pickup, 'useState<FieldErrors>({})', 'useState<PublicPickupFieldErrors>({})')
          replace(
              pickup,
              'function update<K extends keyof FormValues>(key: K, value: FormValues[K]) {',
              'function update<K extends keyof PublicPickupFormValues>(key: K, value: PublicPickupFormValues[K]) {'
          )
          replace(
              pickup,
              'const nextErrors = validate(values, selectedItems.length, pickupTime);',
              'const nextErrors = validatePublicPickupValues(values, selectedItems.length, pickupTime);'
          )

          profile = 'apps/web/src/app/[citySlug]/[businessSlug]/admin/business-profile-form.tsx'
          for old, new in [
              ('<span>Slug</span>', '<span>Slug *</span>'),
              ('<span>Timezone</span>', '<span>Timezone *</span>'),
              ('<span>Valuta</span>', '<span>Valuta *</span>'),
              ('<span>Lingua e formato</span>', '<span>Lingua e formato *</span>'),
          ]:
              replace(profile, old, new)

          page = 'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx'
          replace(
              page,
              'import { PublicInquiryForm } from "../../../components/public-business/public-inquiry-form";\n',
              'import { BusinessOpeningStatus } from "../../../components/public-business/business-opening-status";\nimport { PublicInquiryForm } from "../../../components/public-business/public-inquiry-form";\n'
          )
          replace(
              page,
              '''          {openingStatus ? (\n            <p className="public-business-opening-status" role="status">\n              <strong>{openingStatus.label}</strong>\n              {openingStatus.detail ? <span> · {openingStatus.detail}</span> : null}\n            </p>\n          ) : null}\n''',
              '''          {openingHoursResult?.status === "fulfilled" && openingStatus ? (\n            <BusinessOpeningStatus\n              days={openingDays}\n              initialStatus={openingStatus}\n              timezone={openingHoursResult.value.timezone}\n            />\n          ) : null}\n'''
          )

          opening_test = 'apps/web/src/lib/business-opening-hours.test.ts'
          replace(
              opening_test,
              '''  it("keeps a persisted opening-hours note next to the real interval", () => {\n    expect(\n      formatOpeningDayWithNote({\n        weekday: 0,\n        isClosed: false,\n        note: "Solo su appuntamento",\n        intervals: [{ opensAt: "09:00", closesAt: "13:00", sortOrder: 0 }],\n      }),\n    ).toBe("09:00–13:00 · Solo su appuntamento");\n  });\n});\n''',
              '''  it("keeps a persisted opening-hours note next to the real interval", () => {\n    expect(\n      formatOpeningDayWithNote({\n        weekday: 0,\n        isClosed: false,\n        note: "Solo su appuntamento",\n        intervals: [{ opensAt: "09:00", closesAt: "13:00", sortOrder: 0 }],\n      }),\n    ).toBe("09:00–13:00 · Solo su appuntamento");\n  });\n  it("changes from closed to open and back at the configured boundaries", () => {\n    const hours = monday();\n    expect(\n      getBusinessOpeningStatus(hours, "Europe/Rome", new Date("2026-08-03T06:59:00Z")).state,\n    ).toBe("closed");\n    expect(\n      getBusinessOpeningStatus(hours, "Europe/Rome", new Date("2026-08-03T07:00:00Z")).state,\n    ).toBe("open");\n    expect(\n      getBusinessOpeningStatus(hours, "Europe/Rome", new Date("2026-08-03T11:00:00Z")).state,\n    ).toBe("closed");\n  });\n  it("uses the business timezone instead of the runtime timezone", () => {\n    expect(\n      getBusinessOpeningStatus(monday(), "America/New_York", new Date("2026-08-03T13:30:00Z")).state,\n    ).toBe("open");\n  });\n  it("uses Intl timezone rules across a New York DST transition", () => {\n    const sunday = [\n      {\n        weekday: 6,\n        isClosed: false,\n        note: null,\n        intervals: [{ opensAt: "03:00", closesAt: "04:00", sortOrder: 0 }],\n      },\n    ];\n    expect(\n      getBusinessOpeningStatus(sunday, "America/New_York", new Date("2026-03-08T07:30:00Z")).state,\n    ).toBe("open");\n  });\n});\n'''
          )

          backend_order = 'apps/api/src/platform-core/routes-pickup-ordering.ts'
          replace(backend_order, 'const publicOrderSchema = z\n', 'export const publicOrderSchema = z\n')

          inquiry_test = 'apps/api/test/unit/mvp-domain.test.ts'
          replace(
              inquiry_test,
              'expect(publicInquirySchema.safeParse({ ...valid, name: "<b>Mario</b>" }).success).toBe(false);\n',
              'expect(publicInquirySchema.safeParse({ ...valid, name: "<b>Mario</b>" }).success).toBe(false);\n    expect(publicInquirySchema.safeParse({ ...valid, phone: "<b>333</b>" }).success).toBe(false);\n'
          )

          workflow = '.github/workflows/platform-quality.yml'
          replace(
              workflow,
              '      - name: Unit tests\n        run: npm test\n\n      - name: Lint\n',
              '      - name: API unit tests\n        run: npm test\n\n      - name: Web unit tests\n        run: npm --workspace @platform/web run test\n\n      - name: Lint\n'
          )
          PY

      - name: Format changed files
        run: >-
          npx prettier --write
          apps/web/src/components/public-business/public-pickup-order-form.tsx
          apps/web/src/app/[citySlug]/[businessSlug]/admin/business-profile-form.tsx
          apps/web/src/app/[citySlug]/[businessSlug]/page.tsx
          apps/web/src/lib/business-opening-hours.test.ts
          apps/api/src/platform-core/routes-pickup-ordering.ts
          apps/api/test/unit/mvp-domain.test.ts
          apps/api/test/unit/public-order-schema.test.ts
          apps/web/src/lib/public-form-validation.ts
          apps/web/src/lib/public-form-validation.test.ts
          apps/web/src/lib/public-directory-query.ts
          apps/web/src/lib/public-directory-query.test.ts
          apps/web/src/components/public-home/city-business-directory.tsx
          apps/web/src/components/public-business/business-opening-status.tsx
          .github/workflows/platform-quality.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve public UX polish issues"
          git push origin HEAD:agent/global-city-registry-step1
