name: Format Probe Public

on:
  push:
    branches:
      - agent/unify-public-experience

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print formatted files
        run: |
          npx prettier --write \
            'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx' \
            apps/web/src/components/public-business/business-visual-gallery.tsx \
            apps/web/src/components/public-home/city-business-directory.tsx \
            apps/web/src/components/public-home/global-entry-home.tsx
          for file in \
            'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx' \
            apps/web/src/components/public-business/business-visual-gallery.tsx \
            apps/web/src/components/public-home/city-business-directory.tsx \
            apps/web/src/components/public-home/global-entry-home.tsx
          do
            echo "===FILE_START:${file}==="
            base64 -w0 "$file"
            echo
            echo "===FILE_END:${file}==="
          done
