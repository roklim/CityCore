name: Format Probe Public

on:
  push:
    branches:
      - agent/unify-public-experience

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format dynamic page
        run: |
          npx prettier --write 'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx'
          mkdir -p formatted
          cp 'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx' formatted/page.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-business-page
          path: formatted/page.tsx
          if-no-files-found: error
          retention-days: 1
