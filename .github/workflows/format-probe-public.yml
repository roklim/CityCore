name: Format Probe Public

on:
  push:
    branches:
      - agent/unify-public-experience

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format public files
        run: |
          npx prettier --write \
            'apps/web/src/app/[citySlug]/[businessSlug]/page.tsx' \
            apps/web/src/components/public-business/business-visual-gallery.tsx \
            apps/web/src/components/public-home/city-business-directory.tsx \
            apps/web/src/components/public-home/global-entry-home.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-public-files
          path: |
            apps/web/src/app/[citySlug]/[businessSlug]/page.tsx
            apps/web/src/components/public-business/business-visual-gallery.tsx
            apps/web/src/components/public-home/city-business-directory.tsx
            apps/web/src/components/public-home/global-entry-home.tsx
          if-no-files-found: error
          retention-days: 1
