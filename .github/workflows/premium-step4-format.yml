name: Premium UI Step 4 Format

on:
  push:
    branches:
      - feature/premium-ui-step4-dashboards

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-ui-step4-dashboards
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format STEP 4 files
        run: >-
          npx prettier --write
          apps/web/src/app/admin/page.tsx
          'apps/web/src/app/[citySlug]/[businessSlug]/admin/page.tsx'
          apps/web/src/app/dashboard-premium.css
      - name: Commit formatting when needed
        run: |
          git add apps/web/src/app/admin/page.tsx 'apps/web/src/app/[citySlug]/[businessSlug]/admin/page.tsx' apps/web/src/app/dashboard-premium.css
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format premium dashboards"
          git push origin HEAD:feature/premium-ui-step4-dashboards
