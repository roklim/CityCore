name: Format Probe

on:
  push:
    branches:
      - agent/improve-city-home

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print formatted diff
        run: |
          npx prettier --write apps/web/src/components/public-home/city-business-directory.tsx apps/web/src/components/public-home/city-utility-home.tsx
          git diff -- apps/web/src/components/public-home/city-business-directory.tsx apps/web/src/components/public-home/city-utility-home.tsx
