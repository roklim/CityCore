services:
  - type: web
    name: citycore-api-staging
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm --workspace @platform/api run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
