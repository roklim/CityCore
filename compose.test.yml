services:
  postgres-test:
    image: postgres:16-alpine
    container_name: citycore-postgres-test
    environment:
      POSTGRES_DB: citycore_test
      POSTGRES_USER: citycore_test
      POSTGRES_PASSWORD: citycore_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citycore_test -d citycore_test"]
      interval: 5s
      timeout: 5s
      retries: 12
