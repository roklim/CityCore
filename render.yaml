services:
  - type: web
    name: muchogusto-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
      - key: PICKUP_SLOT_MINUTES
        value: 15
      - key: PICKUP_MAX_ORDERS_PER_SLOT
        value: 4
      - key: PICKUP_START_TIME
        value: "18:00"
      - key: PICKUP_END_TIME
        value: "22:30"
      - key: PICKUP_TIME_ZONE
        value: Europe/Rome
      - key: PICKUP_MIN_PREPARATION_MINUTES
        value: 30
      - key: PICKUP_CLOSED_WEEKDAYS
        value: "1"
