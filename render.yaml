services:
  - type: web
    name: citycore-api-staging
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm ci --include=dev && npm run db:migrate:deploy && npm run build:api
    startCommand: npm --workspace @platform/api run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_BOOTSTRAP_SECRET
        sync: false
      - key: WEB_ORIGINS
        value: https://citycore-web.vercel.app,https://citycore-web-roklims-projects.vercel.app,https://citycore-web-git-main-roklims-projects.vercel.app,https://citycore-web-staging.vercel.app
      - key: TRUST_PROXY_HOPS
        value: 1
